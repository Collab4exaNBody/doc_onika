[project]
dev_addr = "127.0.0.1:8000"
site_name = "Onika"
site_description = "Onika: a component-based HPC platform for numerical simulation codes"
repo_url = "https://github.com/Collab4exaNBody/onika"
repo_name = "Collab4exaNBody/onika"
edit_uri = "https://github.com/Collab4exaNBody/doc_onika/edit/main/docs/"
copyright = "Copyright &copy; 2023-2026 T. Carrard, R. Prat, J.-P. Perlat, P. Lafourcade"
use_directory_urls = false

# One tab per part of the docs, following the knitting metaphor of the home page.
nav = [
    {"Home" = "index.md"},
    {"Discover" = [
        "discover/introduction.md",
        "discover/motivation.md",
        "discover/ecosystem.md",
        "discover/cite.md",
    ]},
    {"Get started" = [
        "getting-started/installation.md",
        "getting-started/first-run.md",
        "getting-started/first-input.md",
        "getting-started/first-operator.md",
        "getting-started/docker-hip.md",
    ]},
    {"Write inputs" = [
        "inputs/msp-language.md",
        "inputs/configuration.md",
    ]},
    {"Build operators" = [
        "operators/anatomy.md",
        "operators/plugins.md",
        "operators/parallel.md",
        "operators/advanced.md",
    ]},
    {"Embed & couple" = [
        "coupling/embedding.md",
    ]},
    {"Python" = [
        "python/pyonika.md",
    ]},
    {"Libraries" = [
        "libraries/memory.md",
        "libraries/math.md",
        "libraries/units.md",
        "libraries/mpi.md",
        "libraries/utilities.md",
    ]},
    {"Run & tune" = [
        "running/command-line.md",
        "running/profiling-debugging.md",
    ]},
    {"Reference" = [
        "reference/builtin-operators.md",
        "reference/cmake-options.md",
        "reference/glossary.md",
        "reference/internals.md",
    ]},
    {"Project" = [
        "project/contributing-docs.md",
    ]},
]

extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

extra_css = [
    "styles/extra_styles.css",
]

# Version (branch) selector: the published site has one folder per branch and a
# versions.json at its root, built by scripts/build_versions.sh.
[project.extra.version]
provider = "mike"
default = "main"

[project.theme]
features = [
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "content.footnote.tooltips",
    "search.highlight",
    "navigation.footer",
    "navigation.top",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.tracking",
    "navigation.sections",
    "navigation.indexes",
]
logo = "img/onika_logo.png"
favicon = "img/onika_logo.png"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "light blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.abbr]
[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
use_pygments = true
pygments_lang_class = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.md_in_html]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.def_list]

[project.markdown_extensions.toc]
toc_depth = 4
permalink = true
