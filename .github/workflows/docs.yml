name: Documentation

# - Every push / pull request builds the docs of that ref in strict mode (check).
# - Pushes to a published branch rebuild and deploy the whole multi-branch site:
#   one folder per branch of DOC_BRANCHES plus a versions.json read by the
#   version selector (see scripts/build_versions.sh).

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Published branches, one site each; the first one is the default version.
  DOC_BRANCHES: "main"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --strict --clean

  deploy:
    needs: check
    if: >-
      github.event_name != 'pull_request' &&
      contains(format(' {0} ', env.DOC_BRANCHES), format(' {0} ', github.ref_name))
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: bash scripts/build_versions.sh public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
